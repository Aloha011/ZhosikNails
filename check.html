<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zhosik Nails — Проверка записи</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0;}
        body{font-family:'Segoe UI',system-ui,sans-serif;background:linear-gradient(135deg,#fce4ec,#fdf6f0,#fff5f7);min-height:100vh;color:#2d1f24;padding:16px;}
        .wrap{max-width:440px;margin:0 auto;background:rgba(255,255,255,0.75);backdrop-filter:blur(20px);border-radius:28px;padding:28px 20px;border:1px solid rgba(255,255,255,0.7);box-shadow:0 8px 40px rgba(232,160,180,0.15);}
        .back{color:#9e7d8a;text-decoration:none;font-size:0.85rem;display:inline-block;margin-bottom:16px;}
        .logo{text-align:center;font-family:'Playfair Display',serif;font-size:2rem;font-weight:700;}
        .logo span{color:#d48196;font-style:italic;}
        .sub{text-align:center;font-size:0.8rem;color:#9e7d8a;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:20px;}
        label{display:block;font-size:0.75rem;font-weight:600;text-transform:uppercase;color:#6b4c5a;margin-bottom:4px;}
        input{width:100%;padding:12px 16px;font-size:0.95rem;font-family:inherit;border:1.5px solid rgba(232,160,180,0.35);border-radius:12px;background:rgba(255,255,255,0.85);outline:none;margin-bottom:12px;}
        input:focus{border-color:#e8a0b4;box-shadow:0 0 0 4px rgba(232,160,180,0.1);}
        .btn{width:100%;padding:14px;font-family:inherit;font-size:0.95rem;font-weight:600;color:#fff;background:linear-gradient(135deg,#e8a0b4,#d48196);border:none;border-radius:20px;cursor:pointer;box-shadow:0 4px 20px rgba(232,160,180,0.35);}
        .btn:disabled{opacity:0.6;}
        .card{background:rgba(255,255,255,0.8);border-radius:16px;padding:16px;margin-top:14px;font-size:0.85rem;line-height:1.8;}
        .badge{display:inline-block;padding:2px 10px;border-radius:10px;font-size:0.7rem;font-weight:600;}
        .b-pending{background:rgba(232,200,139,0.3);color:#8b6914;}
        .b-confirmed{background:rgba(124,191,158,0.3);color:#27835a;}
        .b-cancelled{background:rgba(232,139,139,0.3);color:#c0392b;}
        .hidden{display:none!important;}
        .empty{margin-top:14px;text-align:center;padding:24px;background:rgba(255,255,255,0.8);border-radius:16px;}
    </style>
</head>
<body>
<div class="wrap">
    <a href="index.html" class="back">← Назад</a>
    <div class="logo">Zhosik <span>Nails</span></div>
    <div class="sub">Проверка активных записей</div>
    <label>Номер телефона</label>
    <input id="ph" placeholder="+7 (___) ___-__-__">
    <button class="btn" id="chk">🔍 Проверить</button>
    <div class="card hidden" id="res"></div>
    <div class="empty hidden" id="emp"><h3>📭 Активных записей нет</h3><p style="color:#9e7d8a;margin-top:6px;">По этому номеру ничего не найдено</p></div>
</div>
<script>
const API='https://script.google.com/macros/s/AKfycbysSy81zufCQN_9E1g_GtGCIvD7myNL0drzU3EfcboMvL4aV47Vxuyt_AL6KHhAf3KnrQ/exec';
function $(s){return document.querySelector(s);}
function mask(v){let d=v.replace(/\D/g,'').slice(0,11);if(d.startsWith('8'))d='7'+d.slice(1);if(!d.startsWith('7')&&d.length>0)d='7'+d;let f='+7';if(d.length>1)f+=' ('+d.slice(1,4);if(d.length>=4)f+=') '+d.slice(4,7);if(d.length>=7)f+='-'+d.slice(7,9);if(d.length>=9)f+='-'+d.slice(9,11);return f;}
function cln(v){return v.replace(/\D/g,'');}
function api(p){return new Promise(r=>{const cb='c'+Date.now();window[cb]=d=>{delete window[cb];r(d);};const s=document.createElement('script');s.src=API+'?action='+p.action+'&'+Object.entries(p).filter(([k])=>k!=='action').map(([k,v])=>k+'='+encodeURIComponent(v)).join('&')+'&callback='+cb;s.onerror=()=>{delete window[cb];r({ok:false,error:'Ошибка сети'});};document.head.appendChild(s);setTimeout(()=>{if(window[cb]){delete window[cb];r({ok:false,error:'Таймаут'});}},15000);});}
$('#ph').addEventListener('input',function(){this.value=mask(this.value);});
$('#chk').addEventListener('click',async()=>{
    const ph=cln($('#ph').value);$('#res').classList.add('hidden');$('#emp').classList.add('hidden');
    if(ph.length!==11||!ph.startsWith('7')) return alert('Введите корректный номер');
    const r=await api({action:'check',clientPhone:ph});
    if(r.ok&&r.bookings&&r.bookings.length>0){
        $('#res').innerHTML=r.bookings.map(b=>`<div style="padding:6px 0;border-bottom:1px solid rgba(232,160,180,0.15);"><b>${b.serviceName||b.service}</b><br>${b.date.split('-')[2]}.${b.date.split('-')[1]}.${b.date.split('-')[0]} в ${b.time.slice(0,5)} — <span class="badge b-${b.status==='confirmed'?'confirmed':b.status==='cancelled'?'cancelled':'pending'}">${b.status==='confirmed'?'Подтверждена':b.status==='cancelled'?'Отменена':'Ожидает'}</span></div>`).join('');
        $('#res').classList.remove('hidden');
    } else $('#emp').classList.remove('hidden');
});
</script>
</body>
</html>
